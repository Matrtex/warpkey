name: 定时健康检查

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      app_url:
        description: 临时覆盖 APP_URL，例如 https://your-app.vercel.app
        required: false
        type: string

permissions:
  contents: read

jobs:
  cron-healthcheck:
    name: 调用 cron 接口
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEFAULT_APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
      MANUAL_APP_URL: ${{ inputs.app_url }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: 检查配置
        id: config
        shell: bash
        run: |
          app_url="${MANUAL_APP_URL:-$DEFAULT_APP_URL}"
          app_url="${app_url%/}"

          if [ -z "$app_url" ]; then
            echo "::notice::未配置 APP_URL，已跳过定时健康检查。请在 Repository variables/secrets 中配置 APP_URL，或手动运行时输入 app_url。"
            echo "skip_healthcheck=true" >> "$GITHUB_OUTPUT"
            echo "has_cron_secret=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip_healthcheck=false" >> "$GITHUB_OUTPUT"

          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_SECRET 未配置，将检查公开 /api/full 接口。"
            echo "has_cron_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_cron_secret=true" >> "$GITHUB_OUTPUT"
          fi

          echo "app_url=$app_url" >> "$GITHUB_OUTPUT"

      - name: 调用 cron 健康检查
        if: steps.config.outputs.skip_healthcheck != 'true' && steps.config.outputs.has_cron_secret == 'true'
        shell: bash
        env:
          APP_URL: ${{ steps.config.outputs.app_url }}
        run: |
          response_file="$(mktemp)"
          export RESPONSE_FILE="$response_file"
          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            http_code="$(
              curl --location --silent --show-error --max-time 45 \
                --write-out "%{http_code}" \
                --output "$response_file" \
                -H "Authorization: Bearer ${CRON_SECRET}" \
                "${APP_URL}/api/cron" || echo "000"
            )"

            echo "尝试 ${attempt}/${max_attempts}: HTTP ${http_code}"
            cat "$response_file"
            echo

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              if node <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync(process.env.RESPONSE_FILE, 'utf8'));

          if (body.success !== true) {
            throw new Error('cron 响应中的 success 不是 true');
          }

          const fullCount = Array.isArray(body.full) ? body.full.length : 0;
          const liteCount = Array.isArray(body.lite) ? body.lite.length : 0;
          if (fullCount < 1) {
            throw new Error('cron 响应没有返回可用 key');
          }
          console.log(`full=${fullCount}, lite=${liteCount}, lastUpdated=${body.lastUpdated}`);
          NODE
              then
                exit 0
              fi
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 20))
              echo "健康检查暂未通过，${sleep_seconds} 秒后重试。"
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::cron 接口连续 ${max_attempts} 次检查失败。"
          exit 1

      - name: 调用公开 API 健康检查
        if: steps.config.outputs.skip_healthcheck != 'true' && steps.config.outputs.has_cron_secret == 'false'
        shell: bash
        env:
          APP_URL: ${{ steps.config.outputs.app_url }}
        run: |
          response_file="$(mktemp)"
          export RESPONSE_FILE="$response_file"
          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            http_code="$(
              curl --location --silent --show-error --max-time 45 \
                --write-out "%{http_code}" \
                --output "$response_file" \
                "${APP_URL}/api/full" || echo "000"
            )"

            echo "尝试 ${attempt}/${max_attempts}: HTTP ${http_code}"
            key_count="$(grep -Ec '^[A-Za-z0-9-]+$' "$response_file" || true)"
            echo "key_count=${key_count}"

            if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] && [ "$key_count" -ge 1 ]; then
              exit 0
            fi

            cat "$response_file"
            echo

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 20))
              echo "公开 API 暂未返回可用 key，${sleep_seconds} 秒后重试。"
              sleep "$sleep_seconds"
            fi
          done

          echo "::error::公开 /api/full 接口连续 ${max_attempts} 次没有返回可用 key。"
          exit 1
